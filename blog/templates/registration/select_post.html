{% extends 'blog/base.html' %}

{% block content %}

<div class="max-w-2xl mx-auto mt-10 bg-white shadow-lg rounded-2xl p-6">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Select a Blog Post</h2>
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
             <label for="selected_post" class="block text-gray-700 font-medium mb-2">
                Choose Post
            </label>
        <select name="selected_post" id="selected_post" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
            <option value="">-- Select Post --</option>
            {% for post in posts %}
                <option value="{{ post.id }}" {% if selected_post and selected_post.id == post.id %}selected{% endif %}>
                    {{ post.title }}
                </option>
            {% endfor %}
        </select>
    </div>
        <button type="submit"  class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Load Post</button>
    </form>

    {% if selected_post %}
        <div class="mt-8 p-5 bg-gray-50 rounded-xl border">
                <h3 class="text-xl font-semibold text-gray-800 mb-2">{{ selected_post.title }}</h3>
                <p class="text-gray-600 mb-4">{{ selected_post.content }}</p>
            <div class="flex space-x-4">
                <a href="{% url 'edit_post' selected_post.id %}"  class="flex-1 text-center py-2 px-4 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition">Edit</a>
                <a href="{% url 'delete_post' selected_post.id %}" class="flex-1 text-center py-2 px-4 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">Delete</a>
            </div>
        </div>
    {% endif %}
    </div>
{% endblock%}
