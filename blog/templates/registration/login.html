{% extends 'blog/base.html' %}

{% block content %}

<div class="flex items-center justify-center min-h-screen bg-gray-100 px-4">
  <div class="bg-white shadow-lg rounded-2xl p-6 sm:p-8 max-w-md w-full">
    <h2 class="text-2xl sm:text-3xl font-bold text-center mb-6">Login to Your Account</h2>
    
    {% if form.errors %}
      <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded-lg mb-4 text-sm sm:text-base">
        Invalid username or password. Please try again.
      </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      
      <!-- Username -->
      <div>
        <label for="id_username" class="block text-sm sm:text-base font-medium text-gray-700">Username</label>
        <input type="text" name="username" id="id_username" 
               class="w-full mt-1 p-2 sm:p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" 
               required>
      </div>

      <!-- Password -->
      <div>
        <label for="id_password" class="block text-sm sm:text-base font-medium text-gray-700">Password</label>
        <input type="password" name="password" id="id_password" 
               class="w-full mt-1 p-2 sm:p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" 
               required>
      </div>
      
      <!-- Login Button -->
      <button type="submit" 
              class="w-full bg-blue-600 text-white py-2 sm:py-3 rounded-lg hover:bg-blue-700 transition text-sm sm:text-base">
        Login
      </button>
    </form>

    {% if not user.is_authenticated %}
      <p class="mt-4 text-center text-sm sm:text-base">
        Don't have an account? 
        <a href="{% url 'signup' %}" class="text-blue-600 font-medium hover:underline">Sign Up</a>
      </p>
    {% endif %}
  </div>
</div>

{% endblock %}
