{% extends 'blog/base.html' %}

{% block content %}
    <div class="max-w-xl mx-auto mt-10  shadow-lg rounded-2xl p-6 bg-gray-100">
    <h2 class="text-2xl font-bold mb-6">Create New Post</h2>
    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        {{ formset.as_p }}
        <button type="submit" class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
            Save Post
        </button>
    </form>
</div>
{% endblock %}
