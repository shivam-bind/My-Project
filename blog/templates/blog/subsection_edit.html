{% extends "blog/base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-100 px-4">
  <div class="w-full max-w-2xl bg-white/90 backdrop-blur-lg shadow-2xl rounded-2xl p-6 sm:p-8 transition-transform transform hover:scale-[1.01]">

    <!-- Heading -->
    <h2 class="text-2xl sm:text-3xl font-bold text-center text-gray-800 mb-6 flex items-center justify-center gap-2">
      ✏️ Edit Subsection
    </h2>

    <!-- Form -->
    <form method="POST" class="space-y-5">
      {% csrf_token %}

      <!-- Django Form Fields -->
      <div class="space-y-4">
        {{ form.as_p }}
      </div>

      <!-- Buttons -->
      <div class="flex items-center justify-center gap-4">
        <button type="submit"
          class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl shadow-md transition duration-300 ease-in-out transform hover:-translate-y-1 hover:shadow-lg">
          💾 Save Changes
        </button>

        <a href="{% url 'post_detail' pk=form.instance.blog.pk %}"
          class="flex items-center gap-2 bg-gray-500 hover:bg-gray-600 text-white px-4 py-2.5 rounded-xl shadow-md transition duration-300 ease-in-out transform hover:-translate-y-1 hover:shadow-lg">
          ❌ Cancel
        </a>
      </div>
    </form>

  </div>
</div>
{% endblock %}
