
{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Django blog post</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lobster&subset=latin,latin-ext">
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <!-- <link rel="stylesheet" href="{% static 'css/blog.css' %}"> -->
    </head>
    <body class="p-4 mt-4">
        <header class="flex justify-between ml-0 mr-0 mt-0 p-0 mb-8 border-b-4 border-red-500 h-20 rounded  sticky top-0 bg-white shadow-md">

            <div class="flex justify-between items-center justify-center ml-2 mb-2">
                    <ul class="flex justify-between items-center justify-center mb-2 mt-4 w-90">
                        
                            <li><a href="{% url 'post-list' %}" class=" px-3 py-2 hover:text-red-500 visited:text-purple-600 hover:shadow-lg rounded trnsform transition {% if request.resolver_match.url_name == 'post-list' %} bg-red-500 text-white {% endif %}">Home</a></li>
                            {% if user.is_authenticated %}
                                
                                <li><a href="{% url 'post_new' %}" class=" px-3 py-2 hover:text-red-500 visited:text-purple-600 hover:shadow-lg rounded trnsform transition {% if request.resolver_match.url_name == 'post_new' %} bg-red-500 text-white {% endif %}">New-Post</a></li>
                                <li><a href="{% url 'select_post' %}" class=" px-3 py-2 hover:text-red-500 visited:text-purple-600 hover:shadow-lg rounded trnsform transition {% if request.resolver_match.url_name == 'select_post' %} bg-red-500 text-white {% endif %}">Edit/Delete</a></li>
                                <li>
                                    <form method="post" action="{% url 'logout' %}">
                                        {% csrf_token %}
                                        <button type="submit" class=" px-3 py-2 hover:text-red-500 visited:text-purple-600 hover:shadow-lg rounded trnsform transition {% if request.resolver_match.url_name == 'logout' %} bg-red-500 text-white {% endif %}">Logout</button>
                                    
                                    </form>
                                </li>
                                {% else %}
                            <li><a href="{% url 'login' %}">Login</a></li>
                            <li><a href="{% url 'signup' %}">SignUp</a></li>
                            
                            {% endif %}
                    </ul>
            </div>

            <div class="flex justify-between items-center justify-center ml-2 mb-2 mr-2">
            <ul class="flex space-x-4 mr-1 justify-end items-center justify-center mb-2 mt-4">
                <li><a href="#"><i class="fa-brands fa-twitter hover:text-red-500 visited:text-purple-600 hover:shadow-lg rounded trnsform transition"></i></a></li>
                <li><a href="#"><i class="fa-brands fa-facebook-f hover:text-red-500 visited:text-purple-600 hover:shadow-lg rounded trnsform transition"></i></a></li>
                <li><a href="#"><i class="fa-brands fa-snapchat hover:text-red-500 visited:text-purple-600 hover:shadow-lg rounded trnsform transition"></i></a></li>
                <li><a href="#"><i class="fa-brands fa-instagram hover:text-red-500 visited:text-purple-600 hover:shadow-lg rounded trnsform transition"></i></a></li>
                <li><a href="#"><i class="fa-solid fa-m hover:text-red-500 visited:text-purple-600 hover:shadow-lg rounded trnsform transition"></i></a></li>
            </ul>
            </div>
        </header>
        <main class="w-full flex justify-between m-0 p-0 ">
            
            <div class="w-full">
                    {% block content %}
                    {% endblock %}
            </div>
        </main>
    </body>
</html>
