{% extends 'blog/base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-100 px-4">
  <div class="w-full max-w-2xl bg-white shadow-xl rounded-2xl p-6 sm:p-8">
    
    <!-- Heading -->
    <h2 class="text-xl sm:text-2xl font-bold text-center text-gray-800 mb-6">
      📝 Create New Post
    </h2>

    <!-- Form -->
    <form method="POST" enctype="multipart/form-data" class="space-y-5">
      {% csrf_token %}

      <!-- Form Fields -->
      <div class="space-y-4">
        {{ form.as_p }}
        {{ formset.as_p }}
      </div>

      <!-- Submit Button -->
      <button type="submit" 
              class="w-full py-2 px-4 bg-blue-600 text-white font-medium rounded-lg shadow-md hover:bg-blue-700 hover:shadow-lg active:scale-95 transition">
        💾 Save Post
      </button>
    </form>
  </div>
</div>
{% endblock %}
