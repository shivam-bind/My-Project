    
{% extends 'blog/base.html' %}

{% block content %}

<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="bg-white shadow-lg rounded-2xl p-8 w-96 text-center">
    
    {% if user.is_authenticated %}
      <h3 class="text-xl font-semibold text-gray-800 mb-4">
        Are you sure you want to delete 
        <span class="text-red-600">"{{ post.title }}"</span>?
      </h3>

      <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <!-- Delete Button -->
        <button type="submit" 
                class="w-full bg-red-600 text-white py-2 px-4 rounded-lg hover:bg-red-700 transition">
          Yes, Delete
        </button>

        <!-- Cancel Button -->
        <a href="{% url 'select_post' %}" 
           class="block w-full text-center bg-gray-300 text-gray-800 py-2 px-4 rounded-lg hover:bg-gray-400 transition">
          Cancel
        </a>
      </form>
    {% endif %}
    
  </div>
</div>
