{% extends 'blog/base.html' %}

{% block content %}

<div class="flex items-center justify-center min-h-screen bg-gray-100 px-4">
  <div class="bg-white shadow-xl rounded-2xl p-6 sm:p-8 w-full max-w-md text-center transform transition-all duration-300 hover:scale-[1.02]">
    
    {% if user.is_authenticated %}
      <!-- Heading -->
      <h3 class="text-lg sm:text-xl font-semibold text-gray-800 mb-6">
        ⚠️ Are you sure you want to delete  
        <span class="text-red-600 font-bold">"{{ post.title }}"</span>?
      </h3>

      <!-- Form -->
      <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <!-- Delete Button -->
        <button type="submit" 
                class="w-full flex items-center justify-center gap-2 bg-red-600 text-white py-2 px-4 rounded-lg 
                       shadow-md hover:bg-red-700 hover:shadow-lg active:scale-95 transition">
          <i class="fa-solid fa-trash"></i>
          Yes, Delete
        </button>

        <!-- Cancel Button -->
        <a href="{% url 'select_post' %}" 
           class="block w-full flex items-center justify-center gap-2 bg-gray-300 text-gray-800 py-2 px-4 rounded-lg 
                  shadow-md hover:bg-gray-400 hover:shadow-lg active:scale-95 transition">
          <i class="fa-solid fa-xmark"></i>
          Cancel
        </a>
      </form>
    {% endif %}
    
  </div>
</div>

{% endblock %}
